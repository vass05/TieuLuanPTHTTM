<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hệ Thống Thông Minh AI - Intelligent Systems Studio{% endblock %}</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js 4 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="app-navbar">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                <div class="d-flex align-items-center">
                    <span class="brand-badge"><i class="fa-solid fa-brain me-1"></i>AI</span>
                    <a href="{{ url_for('timeseries.index') }}" class="brand-title">Hệ Thống Thông Minh AI</a>
                </div>
                
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <a href="{{ url_for('timeseries.index') }}" class="nav-pill-custom {% if active_tab == 'market' %}active{% endif %}">
                        <i class="fa-solid fa-chart-line me-1"></i> Dự Báo Thị Trường
                    </a>
                    <a href="{{ url_for('housing.index') }}" class="nav-pill-custom {% if active_tab == 'housing' %}active{% endif %}">
                        <i class="fa-solid fa-building me-1"></i> Định Giá BĐS (XGBoost)
                    </a>
                    <a href="{{ url_for('vision.index') }}" class="nav-pill-custom {% if active_tab == 'vision' %}active{% endif %}">
                        <i class="fa-solid fa-shirt me-1"></i> Thị Giác AI (SE-CNN)
                    </a>
                    <a href="{{ url_for('rag.index') }}" class="nav-pill-custom {% if active_tab == 'rag' %}active{% endif %}">
                        <i class="fa-solid fa-project-diagram me-1"></i> Tri Thức RAG (Neo4j)
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Body -->
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
